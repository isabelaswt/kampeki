<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAMPEKI — Embalagens</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="theme-color" content="#f4f0e8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f0e8; --stage:#ebe5da; --box:#fbf9f5; --ink:#141413; --mut:#736e65; --line:#dcd5c8;
  --salmon:#ff8b86; --salmon-ink:#c24d48; --warn:#b8402f;
  --serif:'Instrument Serif',Georgia,serif; --sans:'Inter Tight',system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#11110f; --stage:#1a1916; --box:#22201d; --ink:#f1ece3; --mut:#9a948a; --line:#2f2c28; --salmon-ink:#ff9d98; --warn:#ff8a73;
}}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.mut{color:var(--mut)}
.warn{color:var(--warn)}
b{font-weight:500}

/* topo: marca + escolha do produto */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:28px;padding:18px 32px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top img{height:20px;width:auto;display:block}
@media (prefers-color-scheme:dark){.top img{filter:invert(1)}}
.kicker{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--mut);white-space:nowrap}
.pick{margin-left:auto;display:flex;align-items:center;gap:10px}
.pick select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--box);border-radius:999px;padding:9px 38px 9px 18px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 20px) 52%,calc(100% - 15px) 52%;background-size:5px 5px;background-repeat:no-repeat}
#sel{min-width:260px;font-weight:500}
.pick select:hover{border-color:var(--ink)}

/* telas largas: ajustes | caixa | outras organizacoes, tudo a vista */
main{display:grid;grid-template-columns:280px minmax(0,1fr) 216px;grid-template-areas:"aj stage rail";gap:40px;padding:32px}
.aj{grid-area:aj}.stage{grid-area:stage}.rail{grid-area:rail}
main>*{min-width:0}
.aj,.rail{position:sticky;top:88px;align-self:start;max-height:calc(100vh - 110px);overflow:auto;scrollbar-width:thin}
.aj{padding-right:4px}
.group{padding:0 0 22px;margin:0 0 22px;border-bottom:1px solid var(--line)}
.group:last-child{border-bottom:0}
.title{font-family:var(--serif);font-size:24px;line-height:1.1;margin:0 0 14px;font-weight:400}
.note{font-size:12.5px;color:var(--mut);margin:-6px 0 14px}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}
input[type=number]{width:62px;text-align:right;border:0;border-bottom:1px solid var(--line);background:transparent;padding:3px 2px;border-radius:0;font-variant-numeric:tabular-nums}
input[type=number]:focus{outline:0;border-bottom-color:var(--salmon-ink)}
input::placeholder{color:var(--mut)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;text-align:right;font-weight:400;border-bottom:1px solid var(--line);vertical-align:middle}
td:first-child,th:first-child{text-align:left}
th{color:var(--mut);font-size:12px;border-bottom-color:var(--ink)}
#tbl td{font-size:13px}
#tbl input{width:44px}
.sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
/* avatar: foto da peca num circulo */
.av{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--stage);box-shadow:inset 0 0 0 1px var(--line);vertical-align:middle;margin-right:10px}
.av img{width:100%;height:100%;object-fit:cover;display:block;background:var(--stage)}
.peca{display:flex;align-items:center;line-height:1.25}
.legend .av{width:22px;height:22px;margin-right:7px}
.legend>span{display:inline-flex;align-items:center}

/* palco */
.stage{min-width:0}
.eyebrow{margin:0 0 6px;color:var(--mut);font-size:13px}
.dim{font-family:var(--serif);font-size:clamp(44px,6vw,76px);line-height:.95;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.dim small{display:block;margin-top:10px;font-family:var(--sans);font-size:13px;letter-spacing:0;color:var(--mut)}
.facts{display:flex;flex-direction:column;gap:4px;margin:18px 0 0;font-size:13.5px;max-width:760px}
.facts>span{position:relative}
/* caixa ideal -> caixa padrao mais proxima */
.cx2{display:flex;align-items:stretch;gap:12px;flex-wrap:wrap;margin-top:6px}
.cxc{flex:1 1 240px;display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--box)}
.cxc .k{font-size:12.5px;color:var(--mut)}
.cxc .v{font-family:var(--serif);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.cxc .d{font-size:12.5px;color:var(--mut)}
.cxc.pad{border-color:var(--salmon)}
.cxc.on{background:color-mix(in srgb,var(--salmon) 14%,var(--box))}
.cxc button{align-self:flex-start;margin-top:10px;font-size:13px;padding:6px 14px;border-color:var(--salmon-ink);color:var(--salmon-ink)}
.cx2 .seta{align-self:center;font-size:20px;color:var(--mut)}
.why{margin:10px 0 0;font-size:12.5px;color:var(--mut);max-width:720px}
.why b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0 0;font-size:12.5px;color:var(--mut)}
.legend>span{white-space:nowrap}
.frame{position:relative;margin-top:22px;width:100%;height:clamp(360px,58vh,660px);display:flex;align-items:center;justify-content:center;background:var(--stage);border-radius:var(--r);overflow:hidden}
.frame svg{width:100%;height:100%;display:block}
.frame svg text{font-family:var(--sans);font-size:12px;fill:var(--mut)}
.frame svg line{stroke:var(--mut)}
.tabs{display:flex;gap:6px;min-height:0;margin-top:14px;align-items:center;font-size:13px}
.tabs:empty{display:none}

/* barra de ferramentas e botoes */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.inl{padding:0;gap:8px;color:var(--mut)}
#lay{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--box);border-radius:999px;padding:7px 14px;max-width:220px;cursor:pointer;color:var(--ink)}
button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer;transition:border-color .15s,background .15s}
button:hover:not(:disabled){border-color:var(--ink)}
button:disabled{opacity:.35;cursor:default}
.tab{padding:5px 12px}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#hint{flex-basis:100%;font-size:12.5px;margin-top:2px}

/* outras organizacoes: coluna ao lado da caixa */
.rail .title{margin-bottom:4px}
.rail .note{margin:0 0 14px}
.sugs{display:flex;flex-direction:column;gap:10px}
.sg{width:100%;background:var(--stage);border:1px solid transparent;border-radius:14px;padding:8px 10px 10px;text-align:left;display:flex;flex-direction:column;gap:1px;font-size:12px;line-height:1.35}
.sg:hover{border-color:var(--salmon)}
.sg svg{width:100%;height:auto;display:block;margin-bottom:6px}
.sg b{font-size:13px}
.sg-h{margin:10px 0 2px;font-size:12.5px;color:var(--mut)}
.sg-h:first-child{margin-top:0}

/* rodape de dados */
.data{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:48px;padding-top:28px;border-top:1px solid var(--line)}
#caixas p{margin:0 0 10px;font-size:13px}
details{border-bottom:1px solid var(--line);padding:9px 0}
summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary::before{content:'+';width:12px;color:var(--mut)}
details[open] summary::before{content:'–'}
details>div{padding:6px 0 4px 20px;font-size:13px}
#all td{font-size:13px}
.nova{margin-top:16px;padding:14px 16px;border:1px dashed var(--salmon-ink);border-radius:14px;display:flex;flex-direction:column;gap:3px}
.nova .k{font-size:12.5px;color:var(--salmon-ink)}
.nova .v{font-family:var(--serif);font-size:26px;line-height:1.1}
.nova .d{font-size:12.5px;color:var(--mut)}
.nova ul{margin:6px 0 10px;padding-left:18px;font-size:13px}
.nova button{align-self:flex-start;border-color:var(--salmon-ink);color:var(--salmon-ink)}
.extras button{padding:2px 10px;font-size:12px;margin-left:4px}

/* notebook: caixa | outras organizacoes; ajustes e medidas descem para baixo da caixa */
@media (max-width:1360px){
  main{grid-template-columns:minmax(0,1fr) 216px;grid-template-areas:"stage rail" "aj aj"}
  .aj{position:static;max-height:none;overflow:visible;display:grid;grid-template-columns:1fr 1.4fr;gap:40px;padding-top:28px;border-top:1px solid var(--line)}
  .aj .group{border-bottom:0;margin:0}
}
@media (max-width:960px){
  .top{flex-wrap:wrap;gap:12px 20px;padding:14px 16px;position:static}
  .pick{margin-left:0;width:100%}
  #sel{min-width:0;flex:1}
  main{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "rail" "aj";padding:20px 16px;gap:28px}
  .rail{position:static;max-height:none;overflow:visible}
  .sugs{flex-direction:row;overflow-x:auto;padding-bottom:8px}
  .sg{flex:0 0 180px}
  .aj{grid-template-columns:1fr}
  .data{grid-template-columns:1fr}
  .frame{height:auto;aspect-ratio:640/440}
}
</style>
</head>
<body>
<header class="top">
  <img src="brand/logo.svg" alt="KAMPEKI">
  <span class="kicker">embalagens</span>
  <div class="pick">
    <select id="sel" aria-label="Produto"></select>
    <select id="layers" aria-label="Camadas"><option value="1">1 camada</option><option value="2">2 camadas</option></select>
  </div>
</header>
<main>
  <aside class="aj">
    <section class="group">
      <h2 class="title">Ajustes da caixa</h2>
      <label>Folga entre peças <input id="gap" type="number" value="0" min="-10"></label>
      <label>Espessura da divisória <input id="wall" type="number" value="2" min="0"></label>
      <label>Margem da parede <input id="margin" type="number" value="2" min="0"></label>
      <label>Folga da tampa <input id="lid" type="number" value="8" min="0"></label>
      <label>Proporção máx. (comp/larg) <input id="ratio" type="number" value="1.8" step=".1" min="1"></label>
      <label>Peças na altura <input id="altura" type="number" value="" min="1" max="12" placeholder="auto"></label>
      <p class="note" style="margin:10px 0 0">Medidas em milímetros.</p>
    </section>
    <section class="group">
      <h2 class="title">Medidas das peças</h2>
      <p class="note">Estimadas — o cardápio não informa. Edite para recalcular.</p>
      <table id="tbl"></table>
    </section>
  </aside>

  <section class="stage">
    <p class="eyebrow">Caixa interna, vista de cima</p>
    <div class="dim" id="dim"></div>
    <div class="facts" id="sug"></div>
    <div class="legend" id="meta"></div>
    <div id="tabs" class="tabs"></div>
    <div id="views" class="frame"></div>
    <div class="toolbar">
      <label class="inl">Organização <select id="lay"></select></label>
      <button id="btnNova" title="Copia a organização atual para testar uma variação">Nova</button>
      <button id="btnSq">Auto quadrada</button>
      <button id="btnRe">Auto retangular</button>
      <button id="btnRename">Renomear</button>
      <button id="btnDel">Excluir</button>
      <span class="sep"></span>
      <button id="btnRot">Girar (R)</button>
      <button id="btnLayer">Outra camada</button>
      <span id="hint" class="mut"></span>
    </div>

    <div class="data">
      <section>
        <h2 class="title">Caixas padrão</h2>
        <label style="max-width:320px">Aproveitamento mínimo (%) <input id="minfill" type="number" value="40" min="30" max="95"></label>
        <div id="caixas" style="margin-top:10px"><span class="mut">calculando…</span></div>
      </section>
      <section>
        <h2 class="title">Todos os produtos</h2>
        <table id="all"></table>
      </section>
    </div>
  </section>

  <aside class="rail">
    <h2 class="title">Outras organizações</h2>
    <p class="note">Clique para usar — depois dá para girar e ajustar.</p>
    <div id="sugs" class="sugs"></div>
  </aside>
</main>
<script src="data.js?v=20261120z"></script>
<script src="app.js?v=20261120z"></script>
</body>
</html>
